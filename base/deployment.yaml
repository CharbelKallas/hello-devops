apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-devops
  labels:
    app.kubernetes.io/name: hello-devops
    app.kubernetes.io/part-of: hello-devops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-devops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-devops
        app.kubernetes.io/part-of: hello-devops
    spec:
      securityContext:
        runAsNonRoot: true
        # Explicit numeric IDs: the kubelet cannot verify runAsNonRoot
        # against the image's non-numeric USER "node", so pin it
        # (uid/gid 1000 = the node user in the official Node image).
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-devops
          # CONTRACT (cross-repository): the repository part must stay
          # exactly <LOCAL_REGISTRY_URL>/hello-devops — the infrastructure
          # repository's Kargo promotion (kustomize-set-image) matches on
          # this full repository name and rewrites the digest in the
          # dev/ and staging/ overlays. CI pushes the `latest` tag that
          # the Kargo Warehouse tracks.
          image: <LOCAL_REGISTRY_URL>/hello-devops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hello-devops-config
          env:
            # Password comes only from the gitignored Secret (see
            # base/secret.example.yaml). optional: true so the pod starts
            # even when the Secret has not been created yet.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-devops-secret
                  key: PGPASSWORD
                  optional: true
          # Readiness gates Service traffic: 200 only when PostgreSQL,
          # MongoDB AND Redis respond (/ready); 503 while a database is
          # down — the pod then receives no new requests.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Liveness only checks that the process answers — a down
          # database must NOT restart the pod (that is /ready's job).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
