apiVersion: v1
kind: Service
metadata:
  name: hello-devops
  labels:
    app.kubernetes.io/name: hello-devops
    app.kubernetes.io/part-of: hello-devops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello-devops
  ports:
    - name: http
      port: 80
      targetPort: http   # container port "http" = 3000
      protocol: TCP
