# EXAMPLE ONLY — this file IS committed, on purpose: it documents the
# Secret shape the Deployment expects. It is deliberately NOT listed in
# base/kustomization.yaml, so Argo CD never renders or manages it.
#
# How the real Secret is used later (manual step, never committed):
#   1. copy this file to `secret.yaml` (the name is gitignored), or
#   2. create it directly:
#        kubectl create secret generic hello-devops-secret \
#          --namespace <env-namespace> --from-literal=PGPASSWORD=...
#
# The Deployment references it with `optional: true`, so pods start fine
# without it (the lab's PostgreSQL uses trust auth). Argo CD's prune
# will not remove a manually created Secret: prune only acts on
# resources it tracks, and this one is not in Git.
apiVersion: v1
kind: Secret
metadata:
  name: hello-devops-secret
  labels:
    app.kubernetes.io/name: hello-devops
    app.kubernetes.io/part-of: hello-devops
type: Opaque
stringData:
  # Empty is correct for the lab (trust authentication). Fill in only
  # if PostgreSQL is ever switched to password authentication.
  PGPASSWORD: ""
