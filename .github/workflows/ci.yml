# CI for hello-devops — build/test only, NO deployment.
#
#   - runs on pull requests and on pushes to master (path-filtered)
#   - "test": install → static module check → unit tests
#   - "integration": the app against real PostgreSQL, MongoDB and Redis
#     (GitHub Actions service containers)
#   - "image": builds the image and pushes
#     <LOCAL_REGISTRY_URL>/hello-devops:latest — the tag the Kargo
#     Warehouse in the infrastructure repository tracks
#
# Deliberately absent (see docs/container-registry.md and the README):
#   - no deploy step: Argo CD + Kargo own deployment/promotion, and
#     both are configured in the infrastructure repository
#   - no AWS / ECR / LocalStack / Docker Hub / any cloud registry
#   - the registry URL comes from a repository VARIABLE
#     (vars.LOCAL_REGISTRY_URL), credentials from a SECRET — nothing
#     host-specific or sensitive is committed
#
# Path filter: only code, tests, and image inputs trigger the workflow.
# Kargo's promotion commits touch dev/ and staging/ only, so they never
# retrigger a build (which would otherwise loop).
name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Static module check
        run: npm run check

      - name: Run unit tests
        run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lab
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lab"
          --health-interval 2s --health-timeout 2s --health-retries 30
      mongodb:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          PGHOST: 127.0.0.1
          MONGODB_URI: mongodb://127.0.0.1:27017/hello-devops
          REDIS_HOST: 127.0.0.1

  image:
    name: Build and push image
    needs: [test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Push only for pushes to master (never from pull requests), and only
    # once the registry is configured as a repository variable — until
    # then this job is skipped and CI still validates the code.
    if: github.event_name == 'push' && vars.LOCAL_REGISTRY_URL != ''
    env:
      IMAGE: ${{ vars.LOCAL_REGISTRY_URL }}/hello-devops:latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build --pull -t "$IMAGE" .

      # Optional: only needed if the local registry requires auth.
      - name: Log in to the registry
        if: vars.LOCAL_REGISTRY_USERNAME != ''
        run: |
          echo "$LOCAL_REGISTRY_PASSWORD" | docker login \
            "$LOCAL_REGISTRY_URL" --username "$LOCAL_REGISTRY_USERNAME" \
            --password-stdin
        env:
          LOCAL_REGISTRY_URL: ${{ vars.LOCAL_REGISTRY_URL }}
          LOCAL_REGISTRY_USERNAME: ${{ vars.LOCAL_REGISTRY_USERNAME }}
          LOCAL_REGISTRY_PASSWORD: ${{ secrets.LOCAL_REGISTRY_PASSWORD }}

      - name: Push :latest (tracked by the Kargo Warehouse)
        run: docker push "$IMAGE"
